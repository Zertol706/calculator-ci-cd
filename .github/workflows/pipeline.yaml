
name: Python Calculator CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Version
        shell: cmd
        run: py --version

      - name: Unit Tests
        shell: cmd
        run: py -m unittest -v

      - name: Deploy to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: |
          if not exist "C:\CI-CD-Demo\Prod dir" mkdir "C:\CI-CD-Demo\Prod dir"
          copy /Y "Calculator.py" "C:\CI-CD-Demo\Prod dir\Calculator.py"
