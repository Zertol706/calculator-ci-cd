
name: Python Calculator CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Version
        run: python --version

      - name: Unit Tests
        run: python -m unittest -v

      - name: Deploy to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $destination = "C:\CI-CD-Demo\Prod dir"
          New-Item -ItemType Directory -Force -Path $destination
          Copy-Item ".\calculator.py" -Destination $destination -Force
